<!DOCTYPE html>
<html>

<head>
  <title>Ad Compromizer</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="header">
    <h2>Ad Compromizer</h2>
    <div class="subtitle">Browse without unwanted redirects</div>
  </div>


  <!-- REDIRECT COUNTER -->

  <div class="redirect-card">

    <div class="redirect-label">
      Total Redirects
    </div>

    <div id="redirectCount" class="redirect-count">
      0
    </div>

    <div class="redirect-description">
      Redirects handled by Ad Compromizer
    </div>

  </div>


  <!-- BUTTONS -->

  <button id="setPrimary">
    Set This as Primary Tab
  </button>

  <button id="toggleProtection">
    Enable Protection
  </button>

  <button id="clearOthers">
    Clear All Except Primary
  </button>


  <!-- STATUS -->

  <p id="status"></p>


  <div class="footer">
    Ad Compromizer • Protection active
  </div>


  <script src="popup.js"></script>

</body>

</html>
